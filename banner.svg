<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Rishabh Jha, backend and systems engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
